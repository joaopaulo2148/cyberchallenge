# ---------------------------------------------------------
# CYBER CHALLENGE - Perfil de PRODUCAO
# ---------------------------------------------------------
# Ativar com a variavel de ambiente SPRING_PROFILES_ACTIVE=prod
#
# Sem valores de fallback para a conexao com o banco: se a variavel de
# ambiente correspondente nao estiver definida no servidor, a aplicacao
# falha ao iniciar em vez de usar um valor padrao inseguro/previsivel.

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&allowPublicKeyRetrieval=false&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

logging.level.root=WARN
logging.level.com.cyberchallenge=INFO
