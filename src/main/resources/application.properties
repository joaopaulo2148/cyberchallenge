# ---------------------------------------------------------
# CYBER CHALLENGE - Configuracao da aplicacao
# ---------------------------------------------------------

spring.application.name=cyber-challenge

server.port=8080

# Banco H2 em arquivo: os dados persistem em disco entre reinicializacoes
# (importante para a atividade extensionista: se o notebook precisar
# reiniciar a aplicacao no meio do evento, o ranking e o dashboard nao se perdem).
spring.datasource.url=jdbc:h2:file:./data/cyberchallenge;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Console H2 disponivel em /h2-console (usuario: sa, senha em branco)
# Util para inspecionar os dados durante o desenvolvimento/apresentacao.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Mensagens de erro mais claras no JSON de resposta
server.error.include-message=always
server.error.include-binding-errors=always
