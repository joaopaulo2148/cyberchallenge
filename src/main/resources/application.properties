# ---------------------------------------------------------
# CYBER CHALLENGE - Configuracao base (perfil "default"/desenvolvimento)
# ---------------------------------------------------------
# Este arquivo tem valores padrao convenientes para RODAR LOCALMENTE sem
# precisar configurar nada antes. Para producao, ative o perfil "prod"
# (SPRING_PROFILES_ACTIVE=prod, veja application-prod.properties).

spring.application.name=cyber-challenge

server.port=${SERVER_PORT:8080}

# URL publica onde a aplicacao roda (usada na configuracao de CORS).
app.base-url=${APP_BASE_URL:http://localhost:8080}

# ---------------------------------------------------------
# Banco de dados: MySQL
# ---------------------------------------------------------
# Todos os valores abaixo podem ser sobrescritos por variaveis de ambiente
# (DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD), sem precisar editar
# este arquivo.
#
# "createDatabaseIfNotExist=true" faz o driver criar o schema/banco
# "cyberchallenge" automaticamente na primeira conexao, caso ele ainda nao
# exista no servidor MySQL.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cyberchallenge}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# "update" cria/ajusta as tabelas automaticamente na primeira execucao,
# sem apagar dados existentes em execucoes seguintes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Mensagens de erro detalhadas no JSON de resposta -- conveniente em
# desenvolvimento; desligado no perfil de producao.
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
